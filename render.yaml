services:
  - type: web
    name: saas-api
    env: node
    buildCommand: npm install && npx prisma generate && npx turbo run build --filter=api
    startCommand: cd apps/api && npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in the Render dashboard after connecting Neon DB
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false # Set your secure JWT secret in Render dashboard
